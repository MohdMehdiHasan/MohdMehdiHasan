<svg fill="none" width="800" height="350" viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 10px; }
    .header { fill: #161b22; }
    .title { fill: #8b949e; font-family: 'Fira Code', monospace, sans-serif; font-size: 13px; font-weight: 600; }
    .prompt { fill: #58a6ff; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; font-weight: bold; }
    .cmd { fill: #79c0ff; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; }
    .text { fill: #c9d1d9; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; }
    .key { fill: #ff7b72; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; }
    .val { fill: #a5d6ff; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; }
    .success { fill: #56d364; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; font-weight: bold; }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Background Card -->
  <rect x="1" y="1" width="798" height="348" rx="10" class="bg" />

  <!-- Terminal Top Bar -->
  <path d="M 1 11 Q 1 1 11 1 L 789 1 Q 799 1 799 11 L 799 38 L 1 38 Z" class="header" />
  <line x1="1" y1="38" x2="799" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="40" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" />
  <text x="80" y="23" class="title">mohammad@macbook:~ (zsh)</text>

  <!-- Lines of Commands -->
  <!-- Line 1 -->
  <text x="20" y="68" class="prompt">mohammad@macbook:~$ <tspan class="cmd">whoami</tspan></text>
  <text x="20" y="92" class="text">Mohammad Mehdi Hasan (AI &amp; Mobile Software Architect)</text>

  <!-- Line 2 -->
  <text x="20" y="126" class="prompt">mohammad@macbook:~$ <tspan class="cmd">cat bio.json</tspan></text>
  <text x="20" y="148" class="text">{</text>
  <text x="40" y="168" class="key">"name"<tspan class="text">: </tspan><tspan class="val">"Mohammad Mehdi Hasan"</tspan><tspan class="text">,</tspan></text>
  <text x="40" y="188" class="key">"education"<tspan class="text">: </tspan><tspan class="val">"Computer Science &amp; Engineering @ Amity"</tspan><tspan class="text">,</tspan></text>
  <text x="40" y="208" class="key">"featured_project"<tspan class="text">: </tspan><tspan class="val">"AIFinSys (Privacy-First AI Tracker)"</tspan></text>
  <text x="20" y="228" class="text">}</text>

  <!-- Line 3 -->
  <text x="20" y="262" class="prompt">mohammad@macbook:~$ <tspan class="cmd">./check_status.sh</tspan></text>
  <text x="20" y="286" class="success">[✓] Flutter &amp; Dart ....... <tspan class="val">ACTIVE</tspan></text>
  <text x="20" y="306" class="success">[✓] FastAPI &amp; Local AI ... <tspan class="val">ACTIVE</tspan></text>
  <text x="20" y="326" class="success">🚀 Status: Open for Software Engineering Opportunities!</text>
  <rect x="515" y="313" width="8" height="15" class="cursor" />
</svg>